<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>cadastro</title>

    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    
    <div id="header"></div>

    <main class="conteudo">
        <section class="conteudo__section">
            <div class="introducao-formulario">
                <h1 class="conteudo__titulo">Formulário de cadastro de usuário</h1>
    
                <p class="conteudo__texto">
                    Preencha este formulário para fazer o cadastro de novos usuários.
                </p>    
            </div>

            <form class="conteudo__formulario" id="userForm">
                <div class="inputs">
                    <label for="nome" class="formulario">Nome:
                        <input class="formulario-dados" type="text" name="nome" id="nome" placeholder="Nome completo" required>
                    </label>
                    <label for="email" class="formulario">E-mail:
                        <input class="formulario-dados" type="email" name="email" id="email" placeholder="E-mail" required>
                    </label>
                    <label for="senha" class="formulario">Senha:
                        <input class="formulario-dados" type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
                    </label>
                    <!-- <label for="senha" class="formulario">Confirma senha:
                        <input class="formulario-dados" type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
                    </label> -->

                    <label for="role" class="formulario-radio ">Nível: 
                        <div class="teste">
                            <input type="radio" id="admin" name="role" value="admin" checked>
                            <label for="admin">Administrador</label>
                            
                            <input type="radio" id="user" name="role" value="user">
                            <label for="user">Usuário</label>
                        </div>   
                    </label>
                    
                </div>
                <div class="botoes">
                    <button class="botao submit" type="submit">Cadastrar</button>
                    <button class="botao reset" type="reset">Limpar</button>
                </div>
            </form>
        </section>

    <div id="footer"></div>

    <script src="../js/layout.js"></script>
    <script src="../js/users.js"></script>
</body>
</html>
