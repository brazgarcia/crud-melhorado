<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">

</head>
<body class="corpo__pagina">
    <div class="div__login"> 
        <a class="link-logo" href="/frontend/pages/home.html">
            <h3 class="cabecalho__titulo">UserPro</h3>
        </a>
        <form action="" method="get">
            
            <div class="input-login">
                <input class="exclusivo-login" type="email" placeholder="E-mail">
                <input class="exclusivo-login" type="password" name="senha" id="senha" placeholder="Senha">
            </div>
            
            <div class="botao-login">
                <button class="botao"> <a class="link__botao-cadastrar" href="/frontend/pages/cadastrar.html">Cadastrar</a></button>
                <button class="botao" type="submit">Entrar</button>
            </div>

        </form>
    </div>
</body>
</html>
